<!DOCTYPE html>
<html>
    <head>
        <title> Form Test </title>
        <link rel="stylesheet" href ="form.css">
    </head>
    <body>
        <div class="form">
        <h2> Student Registration </h1>
        <form>
            <label><u>Student Name</u>:</label>
            <input type="text" id ="txt">
            <br>
            <label> <u>Password:</u> </label>
            <input type="password" id ="txt" class="passwd">
            <br>
            <label><u>Gender:</u></label>
            <div class="opts">
            <input type="radio" name="gender" value="Male">Male
            
            <input type="radio" name="gender" value="Female">Female
            </div>
            <br>
            <label><u>Hobbies:</u></label>
            <br>
            <div class="opts">
            <input type="checkbox">Sports
            
            <input type="checkbox">Reading
           
            <input type="checkbox">Gaming
            
            <input type="checkbox">Other..
            </div>
            <br>
            <input class="btn" type="reset"><input class="btn" type="submit">
        </form>
        </div>
    </body>
</html>
