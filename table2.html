<!DOCTYPE html>
<html>
    <head>
        <title>
            This is a Table
        </title>
        <style>
            table{
                border: 4px solid rgb(0, 0, 0);;
                width:50%;
            }
            th {
                border: 2px solid black;
                border-radius: 2px;
                font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
                color: blue;
                align-items: center;
            }
            td {
                align-items: center;
                border-radius: 2px;
                border: 2px solid black;
                padding: 2px;
                color: gray;
            }
        </style>
    </head>
