<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIT-WPU Course Schedule</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background: #f3f6fb;
      color: #162033;
      font-family: Arial, sans-serif;
    }
    .card {
      width: min(760px, 100%);
      padding: 28px;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(22, 32, 51, 0.12);
    }
    h1 { margin: 0 0 8px; color: #8b1e3f; }
    p { margin: 0 0 22px; color: #526072; }
    table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 8px;
    }
    th, td { padding: 14px 16px; text-align: left; }
    th { background: #8b1e3f; color: #ffffff; }
    td { border-bottom: 1px solid #e4e8ef; }
    tbody tr:nth-child(even) { background: #f8fafc; }
    tbody tr:hover { background: #fff0f4; }
    tbody tr:last-child td { border-bottom: none; }
  </style>
</head>
<body>
  <main class="card">
    <h1>MIT-WPU Course Schedule</h1>
    <p>Sample timetable created using the HTML table tag.</p>
    <table>
      <thead>
        <tr>
          <th>Course Code</th>
          <th>Course Name</th>
          <th>Faculty</th>
          <th>Day</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>CSE101</td><td>Programming Fundamentals</td><td>Dr. Mehta</td><td>Monday</td></tr>
        <tr><td>MAT102</td><td>Discrete Mathematics</td><td>Prof. Shah</td><td>Tuesday</td></tr>
        <tr><td>WEB103</td><td>Web Development</td><td>Dr. Kulkarni</td><td>Wednesday</td></tr>
        <tr><td>DS104</td><td>Data Structures</td><td>Prof. Iyer</td><td>Thursday</td></tr>
      </tbody>
    </table>
  </main>
</body>
</html>
